name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_MEMORY: 1G
  DOCKER_BUILD_CPU: 1.0
  ERGAST_API_BASE_URL: https://api.jolpi.ca/ergast/f1
  ERGAST_API_ENDPOINTS_DRIVER_STANDINGS: /{year}/driverStandings/1.json
  ERGAST_API_ENDPOINTS_RACE_RESULTS: /{year}/results/1.json

jobs:
  build-and-test:
    name: Build, Test, and Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # Create secrets directory and database password for testing
    - name: Setup database credentials
      run: |
        # Create secrets directory with proper permissions
        mkdir -p secrets
        chmod 700 secrets

        # Generate and store database password
        echo "${{ secrets.DB_PASSWORD }}" > secrets/db_password.txt
        
        # Verify file creation and permissions
        if [ ! -f secrets/db_password.txt ]; then
          echo "Error: Failed to create password file"
          exit 1
        fi
        
        # Set restrictive permissions
        chmod 600 secrets/db_password.txt
        
        # Verify file content
        if [ ! -s secrets/db_password.txt ]; then
          echo "Error: Password file is empty"
          exit 1
        fi

    - name: Run build and tests
      run: ./gradlew build

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/tests/

    - name: Upload JaCoCo coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/reports/jacoco/test/html/
        if-no-files-found: error

    # Clean up secrets
    - name: Clean up secrets
      if: always()  # Run even if previous steps fail
      run: |
        if [ -d "secrets" ]; then
          rm -rf secrets/
        fi

  docker:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64

    # Create secrets for Docker build
    - name: Setup database credentials
      run: |
        # Create secrets directory with proper permissions
        mkdir -p secrets
        chmod 700 secrets

        # Generate and store database password
        echo "${{ secrets.DB_PASSWORD }}" > secrets/db_password.txt
        
        # Verify file creation and permissions
        if [ ! -f secrets/db_password.txt ]; then
          echo "Error: Failed to create password file"
          exit 1
        fi
        
        # Set restrictive permissions
        chmod 600 secrets/db_password.txt
        
        # Verify file content
        if [ ! -s secrets/db_password.txt ]; then
          echo "Error: Password file is empty"
          exit 1
        fi

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        platforms: linux/amd64
        build-args: |
          DOCKER_BUILDKIT=1
          ERGAST_API_BASE_URL=${{ env.ERGAST_API_BASE_URL }}
          ERGAST_API_ENDPOINTS_DRIVER_STANDINGS=${{ env.ERGAST_API_ENDPOINTS_DRIVER_STANDINGS }}
          ERGAST_API_ENDPOINTS_RACE_RESULTS=${{ env.ERGAST_API_ENDPOINTS_RACE_RESULTS }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        labels: |
          com.f1champions.description=F1 Champions API
          com.f1champions.department=Engineering
          com.f1champions.service=backend
        memory: ${{ env.DOCKER_BUILD_MEMORY }}
        cpu: ${{ env.DOCKER_BUILD_CPU }}

    # Clean up secrets
    - name: Clean up secrets
      if: always()  # Run even if previous steps fail
      run: |
        if [ -d "secrets" ]; then
          rm -rf secrets/
        fi
 