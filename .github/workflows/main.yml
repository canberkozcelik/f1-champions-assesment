name: CI/CD

on:
  pull_request:
    branches: [ develop, main ]
    types: [opened, synchronize, reopened]  # Only run on PR creation/updates
  push:
    branches: [ develop, main ]
    paths-ignore:  # Ignore workflow file changes in push events
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_MEMORY: 1G
  DOCKER_BUILD_CPU: 1.0
  ERGAST_API_BASE_URL: https://api.jolpi.ca/ergast/f1
  ERGAST_API_ENDPOINTS_DRIVER_STANDINGS: /{year}/driverStandings/1.json
  ERGAST_API_ENDPOINTS_RACE_RESULTS: /{year}/results/1.json
  APK_VERSION: ${{ github.sha }}

jobs:
  # This job determines which paths have changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changed-files-backend.outputs.any_changed }}
      frontend_changed: ${{ steps.changed-files-frontend.outputs.any_changed }}
      workflow_changed: ${{ steps.changed-files-workflow.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed backend files
        id: changed-files-backend
        uses: tj-actions/changed-files@v44
        with:
          files: backend/**

      - name: Get changed frontend files
        id: changed-files-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: frontend/**

      - name: Get changed workflow files
        id: changed-files-workflow
        uses: tj-actions/changed-files@v44
        with:
          files: .github/workflows/**

  build-and-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Run build and tests for Backend
      working-directory: ./backend
      run: ./gradlew build

    - name: Upload backend test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/build/reports/tests/

    - name: Upload backend JaCoCo coverage report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/build/reports/jacoco/test/html/
        if-no-files-found: error # Fails if report not found

  build-android:
    name: Build Android Project
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew in frontend
      working-directory: ./frontend
      run: chmod +x gradlew

    - name: Run tests and generate coverage reports
      working-directory: ./frontend
      run: ./gradlew clean koverHtmlReport
      # This step will fail if any tests fail or if coverage requirements are not met

    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: android-coverage-reports
        path: |
          frontend/app/build/reports/kover/html/
          frontend/core/build/reports/kover/html/
          frontend/data/build/reports/kover/html/
          frontend/domain/build/reports/kover/html/
          frontend/feature/racewinners/build/reports/kover/html/
        if-no-files-found: error # Fails if no reports are found

    - name: Build Android Project
      working-directory: ./frontend
      run: ./gradlew assembleDebug

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build-artifacts
        path: |
          frontend/app/build/outputs/apk/debug/*.apk
          frontend/core/build/outputs/aar/*.aar
          frontend/data/build/outputs/aar/*.aar
          frontend/domain/build/outputs/aar/*.aar
          frontend/feature/racewinners/build/outputs/aar/*.aar
        if-no-files-found: error # Fails if no artifacts are found

  publish-and-deploy:
    name: Publish Artifacts and Deploy
    needs: [changes, build-and-test-backend, build-android]
    if: |
      github.ref == 'refs/heads/main' && 
      (needs.changes.outputs.backend_changed == 'true' || 
       needs.changes.outputs.frontend_changed == 'true' || 
       needs.changes.outputs.workflow_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Only publish APK if frontend changed
    - name: Download APK artifact
      if: needs.changes.outputs.frontend_changed == 'true'
      uses: actions/download-artifact@v4
      with:
        name: android-build-artifacts
        path: ./artifacts

    - name: Create and publish APK image
      if: needs.changes.outputs.frontend_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.apk
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ env.APK_VERSION }}
        platforms: linux/amd64
        labels: |
          com.f1champions.description=F1 Champions Android App
          com.f1champions.type=apk
          com.f1champions.version=${{ env.APK_VERSION }}

    # Only deploy backend if backend changed
    - name: Setup database credentials
      if: needs.changes.outputs.backend_changed == 'true'
      run: |
        mkdir -p infrastructure/secrets
        chmod 700 infrastructure/secrets
        echo "${{ secrets.DB_PASSWORD }}" > infrastructure/secrets/db_password.txt
        chmod 600 infrastructure/secrets/db_password.txt
        
        if [ ! -f infrastructure/secrets/db_password.txt ] || [ ! -s infrastructure/secrets/db_password.txt ]; then
          echo "Error: Failed to create or password file is empty"
          exit 1
        fi

    - name: Build and push backend image
      if: needs.changes.outputs.backend_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infrastructure/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        platforms: linux/amd64
        build-args: |
          DOCKER_BUILDKIT=1
          ERGAST_API_BASE_URL=${{ env.ERGAST_API_BASE_URL }}
          ERGAST_API_ENDPOINTS_DRIVER_STANDINGS=${{ env.ERGAST_API_ENDPOINTS_DRIVER_STANDINGS }}
          ERGAST_API_ENDPOINTS_RACE_RESULTS=${{ env.ERGAST_API_ENDPOINTS_RACE_RESULTS }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        labels: |
          com.f1champions.description=F1 Champions API
          com.f1champions.department=Engineering
          com.f1champions.service=backend
        memory: ${{ env.DOCKER_BUILD_MEMORY }}
        cpu: ${{ env.DOCKER_BUILD_CPU }}

    - name: Clean up secrets
      if: always() && needs.changes.outputs.backend_changed == 'true'
      run: |
        if [ -d "infrastructure/secrets" ]; then
          rm -rf infrastructure/secrets/
        fi
 