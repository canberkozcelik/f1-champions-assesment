name: CI/CD

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main.yml'
  push:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_MEMORY: 1G
  DOCKER_BUILD_CPU: 1.0
  ERGAST_API_BASE_URL: https://api.jolpi.ca/ergast/f1
  ERGAST_API_ENDPOINTS_DRIVER_STANDINGS: /{year}/driverStandings/1.json
  ERGAST_API_ENDPOINTS_RACE_RESULTS: /{year}/results/1.json

jobs:
  build-and-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'pull_request' && 
      github.base_ref == 'develop' && 
      (contains(github.event.pull_request.files.*.path, 'backend/') || 
       contains(github.event.pull_request.files.*.path, '.github/workflows/main.yml'))

    steps:
    - name: Debug Event
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Head ref: ${{ github.head_ref }}"
        echo "Ref: ${{ github.ref }}"
        echo "Changed files:"
        echo "${{ join(github.event.pull_request.files.*.path, '\n') }}"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Run build and tests
      working-directory: ./backend
      run: ./gradlew build

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/build/reports/tests/

    - name: Upload JaCoCo coverage report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/build/reports/jacoco/test/html/
        if-no-files-found: error

  build-android:
    name: Build Android Project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'pull_request' && 
      github.base_ref == 'develop' && 
      (contains(github.event.pull_request.files.*.path, 'frontend/') || 
       contains(github.event.pull_request.files.*.path, '.github/workflows/main.yml'))

    steps:
    - name: Debug Event
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Head ref: ${{ github.head_ref }}"
        echo "Ref: ${{ github.ref }}"
        echo "Changed files:"
        echo "${{ join(github.event.pull_request.files.*.path, '\n') }}"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Build Android Project
      working-directory: ./frontend
      run: ./gradlew assembleDebug

  deploy-docker:
    name: Build and Push Docker Image
    # Only run on pushes to main branch
    if: |
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.modified, '.github/workflows/main.yml'))
    needs: [build-and-test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64

    - name: Setup database credentials
      run: |
        mkdir -p infrastructure/secrets
        chmod 700 infrastructure/secrets
        echo "${{ secrets.DB_PASSWORD }}" > infrastructure/secrets/db_password.txt
        chmod 600 infrastructure/secrets/db_password.txt
        
        if [ ! -f infrastructure/secrets/db_password.txt ] || [ ! -s infrastructure/secrets/db_password.txt ]; then
          echo "Error: Failed to create or password file is empty"
          exit 1
        fi

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infrastructure/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        platforms: linux/amd64
        build-args: |
          DOCKER_BUILDKIT=1
          ERGAST_API_BASE_URL=${{ env.ERGAST_API_BASE_URL }}
          ERGAST_API_ENDPOINTS_DRIVER_STANDINGS=${{ env.ERGAST_API_ENDPOINTS_DRIVER_STANDINGS }}
          ERGAST_API_ENDPOINTS_RACE_RESULTS=${{ env.ERGAST_API_ENDPOINTS_RACE_RESULTS }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        labels: |
          com.f1champions.description=F1 Champions API
          com.f1champions.department=Engineering
          com.f1champions.service=backend
        memory: ${{ env.DOCKER_BUILD_MEMORY }}
        cpu: ${{ env.DOCKER_BUILD_CPU }}

    - name: Clean up secrets
      if: always()
      run: |
        if [ -d "infrastructure/secrets" ]; then
          rm -rf infrastructure/secrets/
        fi
 