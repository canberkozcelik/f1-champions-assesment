name: PR Validation

on:
  pull_request:
    branches: [ develop, main ]
    types: [opened, synchronize, reopened]  # Only validation events

# Add concurrency to prevent multiple runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_MEMORY: 1G
  DOCKER_BUILD_CPU: 1.0
  ERGAST_API_BASE_URL: https://api.jolpi.ca/ergast/f1
  ERGAST_API_ENDPOINTS_DRIVER_STANDINGS: /{year}/driverStandings/1.json
  ERGAST_API_ENDPOINTS_RACE_RESULTS: /{year}/results/1.json
  APK_VERSION: ${{ github.sha }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changed-files-backend.outputs.any_changed }}
      frontend_changed: ${{ steps.changed-files-frontend.outputs.any_changed }}
      workflow_changed: ${{ steps.changed-files-workflow.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed backend files
        id: changed-files-backend
        uses: tj-actions/changed-files@v44
        with:
          files: backend/**

      - name: Get changed frontend files
        id: changed-files-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: frontend/**

      - name: Get changed workflow files
        id: changed-files-workflow
        uses: tj-actions/changed-files@v44
        with:
          files: .github/workflows/**

  build-and-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (needs.changes.outputs.backend_changed == 'true' || 
       needs.changes.outputs.workflow_changed == 'true')
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Run build and tests for Backend
      working-directory: ./backend
      run: ./gradlew build

    - name: Upload backend test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/build/reports/tests/

    - name: Upload backend JaCoCo coverage report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/build/reports/jacoco/test/html/
        if-no-files-found: error

  build-and-test-android:
    name: Build and Test Android Project
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (needs.changes.outputs.frontend_changed == 'true' || 
       needs.changes.outputs.workflow_changed == 'true')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew in frontend
      working-directory: ./frontend
      run: chmod +x gradlew

    - name: Run tests and generate coverage reports
      working-directory: ./frontend
      run: ./gradlew clean koverHtmlReport

    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: android-coverage-reports
        path: |
          frontend/app/build/reports/kover/html/
          frontend/core/build/reports/kover/html/
          frontend/data/build/reports/kover/html/
          frontend/domain/build/reports/kover/html/
          frontend/feature/racewinners/build/reports/kover/html/
        if-no-files-found: error

    - name: Build Android Project
      working-directory: ./frontend
      run: ./gradlew assembleDebug

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build-artifacts
        path: |
          frontend/app/build/outputs/apk/dev/debug/*.apk
          frontend/core/build/outputs/aar/*.aar
          frontend/data/build/outputs/aar/*.aar
          frontend/domain/build/outputs/aar/*.aar
          frontend/feature/racewinners/build/outputs/aar/*.aar
        if-no-files-found: error 