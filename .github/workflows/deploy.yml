name: Deploy

on:
  pull_request:
    branches: [ main ]
    types: [closed]  # Only run on PR close

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_MEMORY: 1G
  DOCKER_BUILD_CPU: 1.0
  ERGAST_API_BASE_URL: https://api.jolpi.ca/ergast/f1
  ERGAST_API_ENDPOINTS_DRIVER_STANDINGS: /{year}/driverStandings/1.json
  ERGAST_API_ENDPOINTS_RACE_RESULTS: /{year}/results/1.json
  APK_VERSION: ${{ github.sha }}

jobs:
  publish-and-deploy:
    name: Publish Artifacts and Deploy
    if: github.event.pull_request.merged == true  # Only run if PR was merged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Need this to create releases
      packages: write
      actions: read  # Need this to download artifacts from other workflows

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Download artifacts from the PR validation workflow
    - name: Find PR validation workflow run
      id: find-workflow
      uses: actions/github-script@v7
      with:
        script: |
          const { data: runs } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'pr-validation.yml',
            branch: context.payload.pull_request.head.ref,
            status: 'completed',
            conclusion: 'success',
            per_page: 1  // We only need the most recent successful run
          });
          
          if (runs.total_count === 0) {
            core.setFailed('No successful PR validation workflow run found for this PR');
            return;
          }
          
          const run = runs.workflow_runs[0];
          core.setOutput('run_id', run.id);
          console.log(`Found successful PR validation workflow run: ${run.id}`);

    - name: Download Android artifacts from PR
      id: download-android
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: pr-validation.yml
        run_id: ${{ steps.find-workflow.outputs.run_id }}
        name: android-build-artifacts
        path: ./artifacts
        token: ${{ secrets.GITHUB_TOKEN }}
        if-no-files-found: warn  # Changed from error to warn

    - name: Build Android if artifacts not found
      if: steps.download-android.outcome == 'failure'
      run: |
        echo "No Android artifacts found, building from scratch..."
        cd frontend
        chmod +x gradlew
        ./gradlew assembleDebug
        mkdir -p ../artifacts/app/build/outputs/apk/dev/debug
        cp app/build/outputs/apk/dev/debug/*.apk ../artifacts/app/build/outputs/apk/dev/debug/

    - name: Verify APK artifacts
      run: |
        echo "Listing contents of artifacts directory:"
        ls -R ./artifacts
        
        APK_DIR="./artifacts/app/build/outputs/apk/dev/debug"
        if [ ! -d "$APK_DIR" ]; then
          echo "Error: APK directory not found at $APK_DIR"
          exit 1
        fi
        
        APK_COUNT=$(ls -1 "$APK_DIR"/*.apk 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "Error: No APK files found in $APK_DIR"
          exit 1
        fi
        
        if [ "$APK_COUNT" -gt 1 ]; then
          echo "Warning: Multiple APK files found. Using the most recent one."
          APK_FILE=$(ls -t "$APK_DIR"/*.apk | head -n1)
        else
          APK_FILE=$(ls "$APK_DIR"/*.apk)
        fi
        
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
        echo "Using APK: $APK_FILE"
        
        # Basic APK validation
        if [ ! -s "$APK_FILE" ]; then
          echo "Error: APK file is empty"
          exit 1
        fi
        
        # Check if it's a valid ZIP file (APK is a ZIP)
        if ! unzip -t "$APK_FILE" >/dev/null 2>&1; then
          echo "Error: APK file is not a valid ZIP archive"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64
        driver-opts: |
          image=moby/buildkit:master
          network=host

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Create GitHub Release with APK
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.sha }}
        tag_name: v${{ github.sha }}
        body: |
          F1 Champions App Release
          
          Backend Docker Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          Changes in this release:
          ${{ github.event.pull_request.body }}
        draft: false
        prerelease: false
        files: ${{ env.APK_FILE }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # Always deploy backend
    - name: Verify Dockerfile
      run: |
        if [ ! -f "./infrastructure/Dockerfile" ]; then
          echo "Error: Dockerfile not found at ./infrastructure/Dockerfile"
          exit 1
        fi

    - name: Setup database credentials
      run: |
        mkdir -p infrastructure/secrets
        chmod 700 infrastructure/secrets
        echo "${{ secrets.DB_PASSWORD }}" > infrastructure/secrets/db_password.txt
        chmod 600 infrastructure/secrets/db_password.txt
        
        if [ ! -f infrastructure/secrets/db_password.txt ] || [ ! -s infrastructure/secrets/db_password.txt ]; then
          echo "Error: Failed to create or password file is empty"
          exit 1
        fi

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infrastructure/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        platforms: linux/amd64
        build-args: |
          DOCKER_BUILDKIT=1
          ERGAST_API_BASE_URL=${{ env.ERGAST_API_BASE_URL }}
          ERGAST_API_ENDPOINTS_DRIVER_STANDINGS=${{ env.ERGAST_API_ENDPOINTS_DRIVER_STANDINGS }}
          ERGAST_API_ENDPOINTS_RACE_RESULTS=${{ env.ERGAST_API_ENDPOINTS_RACE_RESULTS }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        labels: |
          com.f1champions.description=F1 Champions API
          com.f1champions.department=Engineering
          com.f1champions.service=backend
          com.f1champions.release=${{ github.sha }}
        memory: ${{ env.DOCKER_BUILD_MEMORY }}
        cpu: ${{ env.DOCKER_BUILD_CPU }}

    - name: Clean up secrets
      if: always()
      run: |
        if [ -d "infrastructure/secrets" ]; then
          rm -rf infrastructure/secrets/
        fi 

  cleanup-images:
    name: Cleanup Old Docker Images
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-and-deploy
    continue-on-error: true
    permissions:
      packages: write
      contents: read
    steps:
      - name: Get current date for logging
        run: echo "Starting image cleanup at $(date)"

      - name: Get package versions
        id: get-versions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: 'f1-champions-assesment',
                username: context.repo.owner
              });
              
              console.log('Found versions:', versions.length);
              
              // Keep latest, buildcache, and current commit
              const keepTags = ['latest', 'buildcache', process.env.GITHUB_SHA];
              const versionsToDelete = versions.filter(v => {
                // Skip if no tags or metadata
                if (!v.metadata?.container?.tags?.length) {
                  console.log('Skipping version with no tags:', v.id);
                  return false;
                }
                
                const tag = v.metadata.container.tags[0];
                const shouldKeep = keepTags.includes(tag) || tag.startsWith('sha-');
                
                if (shouldKeep) {
                  console.log('Keeping version with tag:', tag);
                }
                
                return !shouldKeep;
              });
              
              console.log('Versions to delete:', versionsToDelete.length);
              
              return versionsToDelete.map(v => ({
                id: v.id,
                tag: v.metadata.container.tags[0]
              }));
            } catch (error) {
              console.error('Error fetching package versions:', error);
              core.setFailed('Failed to fetch package versions: ' + error.message);
              return [];
            }

      - name: Delete old versions
        uses: actions/github-script@v7
        with:
          script: |
            const versionsToDelete = ${{ steps.get-versions.outputs.result }};
            
            if (!versionsToDelete || versionsToDelete.length === 0) {
              console.log('No versions to delete');
              return;
            }
            
            console.log('Versions to delete:', versionsToDelete);
            
            for (const version of versionsToDelete) {
              try {
                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: 'f1-champions-assesment',
                  username: context.repo.owner,
                  package_version_id: version.id
                });
                console.log(`Successfully deleted version: ${version.tag}`);
              } catch (error) {
                console.error(`Failed to delete version ${version.tag}:`, error.message);
                // Don't fail the job on individual deletion failures
              }
            }